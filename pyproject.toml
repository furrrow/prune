[project]
name = "prune"
version = "0.1.0"
description = "VLA alignment project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "diffusers",
    "efficientnet-pytorch",
    "einops",
    "matplotlib",
    "mslk",
    "numpy<2",
    "opencv-python",
    "pandas",
    "pyyaml",
    "scikit-image",
    "tensorboard",
    "torch",
    "torchao",
    "torchdiffeq",
    "torchvision",
    "tqdm",
    "transformers",
    "depth-anything-v2",
    "diffusion-policy",
    "vit-pytorch",
    "scipy-stubs",
    "lmdb",
    "ffmpeg",
    "frechetdist",
    "dtaidistance",
    "huggingface",
    "huggingface-hub",
    "timm",
    "wandb",
    "setuptools",
]

[tool.uv.sources]
depth-anything-v2 = { git = "ssh://git@github.com/debOliveira/depth-anything-V2.git", rev = "main" }
diffusion-policy = { git = "ssh://git@github.com/debOliveira/diffusion_policy.git", rev = "main" }
flownav = { workspace = true }
visualnav-transformer = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"] # Tells setuptools where to find source code

[tool.uv.workspace]
members = ["policies/*"]
